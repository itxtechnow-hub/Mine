<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Mine Telegram Setup</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101923;color:#eef4fa;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,460px);background:#182532;border:1px solid #314456;border-radius:18px;padding:24px}h1{font-size:24px;margin:0 0 8px}p{color:#aebdca;line-height:1.5}label{display:block;margin:18px 0 8px;font-weight:600}input{width:100%;padding:14px;border-radius:10px;border:1px solid #496176;background:#0d1720;color:white;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:#3987f6;color:white;font-weight:700;font-size:16px}button:disabled{opacity:.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d1720;border-radius:10px;padding:12px;color:#d9e8f7}.small{font-size:13px}
</style></head><body><main class="card"><h1>Mine Telegram Setup</h1><p>This securely checks the current Telegram webhook and registers the current Production URL. Your bot token stays on Vercel.</p><form id="setup"><label for="secret">Telegram webhook secret</label><input id="secret" type="password" autocomplete="off" required placeholder="Paste TELEGRAM_WEBHOOK_SECRET"><button id="go">Check and repair webhook</button></form><p class="small">The secret is sent directly to your Mine server over HTTPS. Do not share it in chat.</p><pre id="result" hidden></pre></main><script>
const form=document.getElementById('setup'),btn=document.getElementById('go'),out=document.getElementById('result');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Checking Telegram…';out.hidden=false;out.textContent='Working…';try{const r=await fetch('/api/telegram?action=setup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({setupSecret:document.getElementById('secret').value})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Setup failed');out.textContent='Webhook registered successfully.\\nCurrent URL: '+j.webhookUrl+'\\nPrevious URL: '+(j.previousUrl||'(none)')+'\\nPending updates: '+j.pendingUpdateCount+(j.lastError?'\\nTelegram last error: '+j.lastError:'')+'\\n\\nNow open your bot and send /start.';document.getElementById('secret').value='';}catch(err){out.textContent='Error: '+err.message;}finally{btn.disabled=false;btn.textContent='Check and repair webhook';}});
</script></body></html>
